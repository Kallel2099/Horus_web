<div class="container mt-3">

  <div *ngIf="successmsg" class="alert alert-success alert-dismissible fade show" role="alert">
    <strong>{{ successmsg }}</strong>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>

  <table class="table table-bordered">
    <thead>
      <tr>
        <th scope="col">Matricula</th>
        <th scope="col">Login</th>
        <th scope="col">Nivel</th>
        <th scope="col">Nome</th>
        <th scope="col">Senha</th>
        <th scope="col">Edit</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor = 'let us of readData'>
        <th scope="row">{{us.Matricula}}</th>
        <td>{{us.Login}}</td>
        <td>{{us.Nivel}}</td>
        <td>{{us.Nome}}</td>
        <td>{{us.Senha}}</td>
        <td>
          <button class="btn btn-sm btn-danger" (click)="deleteMat(us.Matricula)">Delete</button>
          &nbsp;
          <a [routerLink]="['/create', us.Matricula]" class="btn btn-sm btn-success">Update</a>
        </td>
      </tr>
    </tbody>
  </table>
</div>
